[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "dued"
version = "0.1.0"
description = "Due-diligence CLI for Python, TypeScript, and Rust codebases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mike Hukiewitz" }]
keywords = ["due-diligence", "static-analysis", "python", "typescript", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/MHHukiewitz/dued"
Repository = "https://github.com/MHHukiewitz/dued"
Issues = "https://github.com/MHHukiewitz/dued/issues"
Documentation = "https://github.com/MHHukiewitz/dued/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dued = "dued.cli:app"

[tool.maturin]
manifest-path = "dued-rs/Cargo.toml"
python-source = "src"
module-name = "dued._native"
features = ["extension-module"]
include = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
