[package]
name = "dued-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust engine for the dued due-diligence CLI"
license = "MIT"

[lib]
name = "dued_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dued"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
# Real Jina ONNX embeddings. Default / stub / --no-embed builds omit ort.
jina = ["dep:ort", "dep:hf-hub", "dep:tokenizers"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
hex = "0.4"
hf-hub = { version = "0.4", optional = true }
# Pin: caret on 2.0.0-rc.10 floated to rc.13 (edition 2024, rust-version 1.88).
ort = { version = "=2.0.0-rc.10", features = ["download-binaries"], optional = true }
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
tokenizers = { version = "0.21", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
walkdir = "2"
