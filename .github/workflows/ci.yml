name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Pytest
        env:
          DUED_STUB_EMBED: "1"
        run: pytest
      - name: Cargo test
        run: cargo test --manifest-path dued-rs/Cargo.toml
